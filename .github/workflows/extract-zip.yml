
name: Extract ZIP into Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - zmm.zip

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP files
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path, PurePosixPath
          import shutil

          archive = Path("zmm.zip")
          output = Path("zmm_unpacked")

          if not archive.exists():
              raise SystemExit("zmm.zip topilmadi!")

          if output.exists():
              shutil.rmtree(output)

          output.mkdir()

          allowed = {
              ".py", ".html", ".htm", ".js", ".css",
              ".json", ".md", ".txt", ".yml", ".yaml",
              ".sql", ".toml", ".xml", ".sh", ".ini", ".cfg"
          }

          total = 0
          count = 0

          with ZipFile(archive) as z:
              for item in z.infolist():
                  p = PurePosixPath(item.filename)

                  if item.is_dir():
                      continue

                  if p.is_absolute() or ".." in p.parts:
                      continue

                  if any(part.startswith(".") for part in p.parts):
                      continue

                  if p.name.lower() in {
                      ".env", "credentials.json",
                      "id_rsa", "id_ed25519"
                  }:
                      continue

                  if p.suffix.lower() not in allowed:
                      continue

                  if item.file_size > 2_000_000:
                      continue

                  total += item.file_size
                  if total > 20_000_000:
                      raise SystemExit("Fayllar hajmi 20 MB dan oshdi!")

                  target = output.joinpath(*p.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)

                  with z.open(item) as src, target.open("wb") as dst:
                      shutil.copyfileobj(src, dst)

                  count += 1

          print(f"Jami {count} ta fayl chiqarildi.")
          PY

      - name: Save extracted files to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zmm_unpacked/
          git commit -m "Extract source files from zmm.zip" || echo "No changes"
          git push
          
